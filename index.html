<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPNITO54 Speed Test</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#10121c;color:white;
font-family:Arial,sans-serif;text-align:center;
padding:25px 18px
}
h1{color:#a77bff;margin-top:35px}
p{color:#aaa}
.circle{
width:260px;height:260px;border:9px solid #8755ed;
border-radius:50%;margin:45px auto;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
box-shadow:0 0 25px #7545dd55
}
#speed{font-size:65px;font-weight:bold}
.unit{font-size:20px;color:#aaa}
.stats{display:flex;justify-content:space-around;gap:8px}
.stat{background:#1c2030;padding:20px 8px;border-radius:15px;flex:1}
.stat strong{display:block;font-size:25px;margin-top:12px}
button{
width:100%;padding:18px;margin-top:30px;
border:0;border-radius:15px;
background:#8755ed;color:white;
font-size:18px;font-weight:bold
}
</style>
</head>
<body>
<h1>VPNITO54 SPEED TEST</h1>
<p>Internet Connection Analyzer</p>
<div class="circle">
<div id="speed">0</div>
<div class="unit">Mbps</div>
<p id="status">Ready to test</p>
</div>
<div class="stats">
<div class="stat">DOWNLOAD<strong id="down">--</strong>Mbps</div>
<div class="stat">UPLOAD<strong id="up">--</strong>Mbps</div>
<div class="stat">PING<strong id="ping">--</strong>ms</div>
</div>
<button onclick="testSpeed()">START TEST</button>
<script>
async function testSpeed(){
let speed=document.getElementById('speed');
let status=document.getElementById('status');
status.innerText='Testing...';
speed.innerText='...';
try{
let start=performance.now();
let response=await fetch('https://speed.cloudflare.com/__down?bytes=5000000');
let data=await response.arrayBuffer();
let seconds=(performance.now()-start)/1000;
let mbps=((data.byteLength*8)/seconds/1000000).toFixed(1);
speed.innerText=mbps;
document.getElementById('down').innerText=mbps;
document.getElementById('ping').innerText=Math.round(seconds*1000/5);
status.innerText='Test completed';
}catch(e){
status.innerText='Connection error';
speed.innerText='--';
}
}
</script>
</body>
</html>
